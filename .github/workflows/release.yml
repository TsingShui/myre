name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"
  NPM_VERSION: "12.2.2"
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    env:
      RELEASE_TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Run core tests, including offline npm installation
        run: bun test --timeout 60000
      - name: Build, smoke-test, and package
        run: bun run scripts/release.ts build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: myre-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npm_package:
    name: Prepare npm packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Pin npm
        run: npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: myre-*
          path: dist/release
          merge-multiple: true
      - name: Verify complete Release asset set
        run: bun run scripts/release.ts checksums
      - name: Pack four platform packages and the main package
        run: bun run scripts/npm.ts pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-packages
          path: |
            dist/npm/*.tgz
            dist/npm/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: npm_package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: myre-*
          path: dist/release
          merge-multiple: true
      - name: Verify asset set and generate checksums
        run: bun run scripts/release.ts checksums
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_VERSION" --jq .sha)
          if [[ "$remote_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Release tag moved after the build; refusing to publish." >&2
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "Refusing to overwrite an already published release." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_VERSION" --draft --verify-tag --generate-notes --title "$RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_VERSION" dist/release/* --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease=false --latest
          fi

  publish_npm:
    name: Publish npm packages with OIDC
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [publish, npm_package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Pin npm
        run: npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-packages
          path: dist/npm
      - name: Publish platform packages first and myre last
        run: bun run scripts/npm.ts publish
