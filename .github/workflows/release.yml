name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.4"
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
    env:
      RELEASE_TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check types
        run: bun run typecheck
      - name: Build and package
        run: bun run scripts/release.ts build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: myre-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish complete GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: myre-*
          path: dist/release
          merge-multiple: true
      - name: Generate checksums
        run: bun run scripts/release.ts checksums
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_VERSION" --jq .sha)
          if [[ "$remote_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Release tag moved after the build; refusing to publish." >&2
            exit 1
          fi
          if draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "Refusing to overwrite an already published release." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_VERSION" --draft --verify-tag --generate-notes --title "$RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_VERSION" dist/release/* --clobber
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_VERSION" --draft=false --prerelease=false --latest
          fi
